name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm run test
        continue-on-error: true

  build-backend:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake

      - name: Build backend
        run: npx nx build backend

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx nx build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qanto
          POSTGRES_PASSWORD: qanto_password
          POSTGRES_DB: qanto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Setup database
        run: |
          cd apps/backend
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://qanto:qanto_password@localhost:5432/qanto_test

      - name: Start backend
        run: |
          cd apps/backend
          npm run start:prod &
          sleep 10
        env:
          DATABASE_URL: postgresql://qanto:qanto_password@localhost:5432/qanto_test
          JWT_SECRET: test-secret-key-for-ci
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: 4000

      - name: Start frontend
        run: |
          cd apps/frontend
          npm run start &
          sleep 10
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          PORT: 3000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          FRONTEND_URL: http://localhost:3000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
